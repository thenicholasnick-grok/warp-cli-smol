name: Repack headless WARP

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1" # Monday 06:00 UTC

permissions:
  contents: write # gh release create/delete + force-push install-dist

jobs:
  repack:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install dpkg-dev and binutils
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev binutils

      - name: Repack Debian trixie cloudflare-warp as headless
        run: bash ./repack.sh

      - name: Upload headless .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-warp-headless
          path: cloudflare-warp-headless_*_amd64.deb
          retention-days: 14
          if-no-files-found: error

      - name: Publish rolling GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          versioned=(cloudflare-warp-headless_*_amd64.deb)
          if ((${#versioned[@]} != 1)); then
            echo "expected exactly one versioned .deb, found: ${versioned[*]:-none}" >&2
            exit 1
          fi
          cp -f "${versioned[0]}" cloudflare-warp-headless_amd64.deb

          sha256sum cloudflare-warp-headless_amd64.deb "${versioned[0]}" > SHA256SUMS
          echo "Published checksums:"
          cat SHA256SUMS
          [[ -s SHA256SUMS ]] || { echo "SHA256SUMS is empty" >&2; exit 1; }
          awk -v name="cloudflare-warp-headless_amd64.deb" '
            $1 ~ /^[0-9a-f]{64}$/ && $NF == name { found = 1 }
            END { exit !found }
          ' SHA256SUMS || { echo "SHA256SUMS missing stable asset" >&2; exit 1; }
          awk -v name="$(basename "${versioned[0]}")" '
            $1 ~ /^[0-9a-f]{64}$/ && $NF == name { found = 1 }
            END { exit !found }
          ' SHA256SUMS || { echo "SHA256SUMS missing versioned asset" >&2; exit 1; }

          if gh release view latest >/dev/null 2>&1; then
            gh release delete latest --yes --cleanup-tag
          fi

          notes_file="$(mktemp)"
          cat >"$notes_file" <<EOF
          Unofficial headless rebuild of the Debian trixie cloudflare-warp package.

          IPv6-only guests (install.sh default — raw.githubusercontent.com has AAAA):
          https://raw.githubusercontent.com/${{ github.repository }}/install-dist/cloudflare-warp-headless_amd64.deb
          https://raw.githubusercontent.com/${{ github.repository }}/install-dist/SHA256SUMS

          GitHub Release (browsers / IPv4; github.com has no AAAA):
          https://github.com/${{ github.repository }}/releases/latest/download/cloudflare-warp-headless_amd64.deb
          https://github.com/${{ github.repository }}/releases/latest/download/SHA256SUMS

          This run built $(basename "${versioned[0]}").

          Do not apt-get install cloudflare-warp afterwards.
          EOF

          gh release create latest \
            --title "cloudflare-warp-headless (rolling)" \
            --notes-file "$notes_file" \
            cloudflare-warp-headless_amd64.deb \
            "${versioned[0]}" \
            SHA256SUMS

      - name: Publish dual-stack install-dist branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash ./publish-install-dist.sh \
            cloudflare-warp-headless_amd64.deb \
            SHA256SUMS \
            "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
