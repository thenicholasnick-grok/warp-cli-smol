name: Repack headless WARP

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1" # Monday 06:00 UTC

permissions:
  contents: read

jobs:
  repack:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install dpkg-dev and binutils
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev binutils

      - name: Repack cloudflare-warp as headless
        run: bash ./repack.sh

      - name: Upload headless .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-warp-headless
          path: cloudflare-warp-headless_*_amd64.deb
          retention-days: 14
          if-no-files-found: error
