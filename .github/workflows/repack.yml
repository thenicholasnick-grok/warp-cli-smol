name: Repack headless WARP

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1" # Monday 06:00 UTC

permissions:
  contents: write # gh release create/delete + force-push install-dist

jobs:
  repack:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install dpkg-dev and binutils
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev binutils

      - name: Repack Debian bookworm and trixie cloudflare-warp as headless
        run: |
          set -euo pipefail
          failed=0
          for suite in bookworm trixie; do
            if ! bash ./repack.sh "$suite"; then
              echo "repack failed for ${suite}" >&2
              failed=1
            fi
          done
          exit "$failed"

      - name: Upload headless .deb artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-warp-headless
          path: |
            cloudflare-warp-headless_bookworm_*_amd64.deb
            cloudflare-warp-headless_trixie_*_amd64.deb
          retention-days: 14
          if-no-files-found: error

      - name: Publish rolling GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          bookworm_ver=(cloudflare-warp-headless_bookworm_*_amd64.deb)
          trixie_ver=(cloudflare-warp-headless_trixie_*_amd64.deb)
          if ((${#bookworm_ver[@]} != 1)); then
            echo "expected exactly one bookworm versioned .deb, found: ${bookworm_ver[*]:-none}" >&2
            exit 1
          fi
          if ((${#trixie_ver[@]} != 1)); then
            echo "expected exactly one trixie versioned .deb, found: ${trixie_ver[*]:-none}" >&2
            exit 1
          fi
          cp -f "${bookworm_ver[0]}" cloudflare-warp-headless_bookworm_amd64.deb
          cp -f "${trixie_ver[0]}" cloudflare-warp-headless_trixie_amd64.deb
          cp -f "${trixie_ver[0]}" cloudflare-warp-headless_amd64.deb

          sha256sum \
            cloudflare-warp-headless_amd64.deb \
            cloudflare-warp-headless_bookworm_amd64.deb \
            cloudflare-warp-headless_trixie_amd64.deb \
            "${bookworm_ver[0]}" \
            "${trixie_ver[0]}" \
            > SHA256SUMS
          echo "Published checksums:"
          cat SHA256SUMS
          [[ -s SHA256SUMS ]] || { echo "SHA256SUMS is empty" >&2; exit 1; }

          require_sum() {
            local name="$1"
            awk -v name="$name" '
              $1 ~ /^[0-9a-f]{64}$/ && $NF == name { found = 1 }
              END { exit !found }
            ' SHA256SUMS || { echo "SHA256SUMS missing ${name}" >&2; exit 1; }
          }
          require_sum cloudflare-warp-headless_amd64.deb
          require_sum cloudflare-warp-headless_bookworm_amd64.deb
          require_sum cloudflare-warp-headless_trixie_amd64.deb
          require_sum "$(basename "${bookworm_ver[0]}")"
          require_sum "$(basename "${trixie_ver[0]}")"
          cmp -s cloudflare-warp-headless_amd64.deb cloudflare-warp-headless_trixie_amd64.deb \
            || { echo "legacy amd64 deb is not the trixie build" >&2; exit 1; }

          if gh release view latest >/dev/null 2>&1; then
            gh release delete latest --yes --cleanup-tag
          fi

          notes_file="$(mktemp)"
          cat >"$notes_file" <<EOF
          Unofficial headless rebuild of the Debian bookworm and trixie cloudflare-warp packages.
          install.sh reads /etc/os-release and downloads the matching suite deb.

          IPv6-only guests (install.sh default — raw.githubusercontent.com has AAAA):
          https://raw.githubusercontent.com/${{ github.repository }}/install-dist/cloudflare-warp-headless_bookworm_amd64.deb
          https://raw.githubusercontent.com/${{ github.repository }}/install-dist/cloudflare-warp-headless_trixie_amd64.deb
          https://raw.githubusercontent.com/${{ github.repository }}/install-dist/cloudflare-warp-headless_amd64.deb
          https://raw.githubusercontent.com/${{ github.repository }}/install-dist/SHA256SUMS

          cloudflare-warp-headless_amd64.deb is the trixie build so existing links keep working.

          GitHub Release (browsers / IPv4; github.com has no AAAA):
          https://github.com/${{ github.repository }}/releases/latest/download/cloudflare-warp-headless_bookworm_amd64.deb
          https://github.com/${{ github.repository }}/releases/latest/download/cloudflare-warp-headless_trixie_amd64.deb
          https://github.com/${{ github.repository }}/releases/latest/download/cloudflare-warp-headless_amd64.deb
          https://github.com/${{ github.repository }}/releases/latest/download/SHA256SUMS

          This run built $(basename "${bookworm_ver[0]}") and $(basename "${trixie_ver[0]}").

          Do not apt-get install cloudflare-warp afterwards.
          EOF

          gh release create latest \
            --title "cloudflare-warp-headless (rolling)" \
            --notes-file "$notes_file" \
            cloudflare-warp-headless_amd64.deb \
            cloudflare-warp-headless_bookworm_amd64.deb \
            cloudflare-warp-headless_trixie_amd64.deb \
            "${bookworm_ver[0]}" \
            "${trixie_ver[0]}" \
            SHA256SUMS

      - name: Publish dual-stack install-dist branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash ./publish-install-dist.sh \
            SHA256SUMS \
            cloudflare-warp-headless_amd64.deb \
            cloudflare-warp-headless_bookworm_amd64.deb \
            cloudflare-warp-headless_trixie_amd64.deb \
            "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
